<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asistente de Estudio AI-First | Generación T</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; justify-content: center; }
    .container { max-width: 650px; width: 100%; background: #1e293b; padding: 24px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    h1 { font-size: 1.5rem; margin-top: 0; color: #38bdf8; }
    p.subtitle { color: #94a3b8; font-size: 0.9rem; margin-bottom: 20px; }
    label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.9rem; }
    input, textarea, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #f8fafc; margin-bottom: 16px; font-size: 0.95rem; }
    button { width: 100%; padding: 14px; background: #0284c7; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; transition: 0.2s; }
    button:hover { background: #0369a1; }
    button:disabled { background: #475569; cursor: not-allowed; }
    .result { margin-top: 20px; padding: 16px; background: #0f172a; border-radius: 8px; border-left: 4px solid #38bdf8; white-space: pre-wrap; line-height: 1.5; display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🧠 Asistente de Estudio AI-First</h1>
    <p class="subtitle">Proyecto Final - Stage 2 (Generación T) | Desarrollado con mentalidad IA Nativa</p>

    <label for="apiKey">Tu API Key de Google Gemini (opcional para modo demo):</label>
    <input type="password" id="apiKey" placeholder="Pegá tu API Key aquí (AIza...)">

    <label for="mode">¿Qué necesitás que haga la IA?</label>
    <select id="mode">
      <option value="resumen">Resumir texto en puntos clave</option>
      <option value="preguntas">Crear 3 preguntas de examen con respuestas</option>
      <option value="explicar">Explicarlo como para principiantes</option>
    </select>

    <label for="inputText">Pegá tus apuntes o el tema a estudiar:</label>
    <textarea id="inputText" rows="5" placeholder="Escribí o pegá el texto acá..."></textarea>

    <button id="btnGenerate" onclick="procesarConIA()">✨ Generar con IA</button>

    <div id="output" class="result"></div>
  </div>

  <script>
    async function procesarConIA() {
      const apiKey = document.getElementById('apiKey').value.trim();
      const mode = document.getElementById('mode').value;
      const text = document.getElementById('inputText').value.trim();
      const output = document.getElementById('output');
      const btn = document.getElementById('btnGenerate');

      if (!text) {
        alert("Por favor, ingresá un texto o tema primero.");
        return;
      }

      btn.disabled = true;
      btn.innerText = "Procesando con IA...";
      output.style.display = "block";
      output.innerText = "Analizando contenido...";

      const prompts = {
        resumen: `Resume el siguiente texto en 3 a 5 viñetas claras y concisas:\n\n${text}`,
        preguntas: `Genera 3 preguntas de repaso con sus respuestas correctas basadas en este texto:\n\n${text}`,
        explicar: `Explica el siguiente concepto de manera simple, clara y con un ejemplo cotidiano:\n\n${text}`
      };

      // Si no se ingresa API Key, ejecuta una respuesta simulada funcional para demostración
      if (!apiKey) {
        setTimeout(() => {
          output.innerText = `🤖 [MODO DEMOSTRACIÓN - SIN API KEY]\n\nAcción seleccionada: ${mode.toUpperCase()}\n\nResultado generado para tu texto:\n• Idea principal extraída correctamente del contenido ingresado.\n• Concepto clave identificado para repaso rápido.\n• Tip: Ingresá tu API Key gratuita de Google AI Studio arriba para obtener respuestas reales en vivo con Gemini.`;
          btn.disabled = false;
          btn.innerText = "✨ Generar con IA";
        }, 1000);
        return;
      }

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompts[mode] }] }]
          })
        });

        const data = await response.json();
        if (data.error) throw new Error(data.error.message);

        output.innerText = data.candidates[0].content.parts[0].text;
      } catch (error) {
        output.innerText = "❌ Error al conectar con la API: " + error.message;
      } finally {
        btn.disabled = false;
        btn.innerText = "✨ Generar con IA";
      }
    }
  </script>
</body>
</html>
